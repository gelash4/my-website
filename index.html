<!-- index.html - Главная страница магазина мебели с API сохранением в GitHub -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин мебели</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-blue-600 text-white p-6 text-center">
    <h1 class="text-3xl font-bold">Мебель от Dima Gela</h1>
    <p class="mt-2">Каталог мебели с доставкой по всей Украине</p>
  </header>

  <main class="p-6 max-w-5xl mx-auto">
    <h2 class="text-2xl font-semibold mb-4">Каталог товаров</h2>

    <div id="categoryFilter" class="flex gap-2 flex-wrap mb-6">
      <button class="bg-gray-200 hover:bg-blue-200 px-3 py-1 rounded" data-category="all">Все</button>
    </div>

    <div id="catalog" class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"></div>

    <div class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Добавить товар</h2>
      <form id="adminForm" class="bg-white p-4 rounded shadow grid gap-4 max-w-xl">
        <input class="border p-2 rounded" name="name" placeholder="Название товара" required>
        <input class="border p-2 rounded" name="description" placeholder="Описание товара" required>
        <input class="border p-2 rounded" name="price" placeholder="Цена (например, ₴ 4500)" required>
        <input class="border p-2 rounded" name="image" placeholder="Ссылка на изображение" required>
        <input class="border p-2 rounded" name="category" placeholder="Категория" required>
        <button type="submit" class="bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">Добавить в каталог</button>
      </form>
    </div>

    <div class="mt-12">
      <h2 class="text-xl font-semibold mb-4">Заказать товар</h2>
      <form class="bg-white p-4 rounded shadow grid gap-4 max-w-md" name="orderForm">
        <input class="border p-2 rounded" type="text" placeholder="Ваше имя" required>
        <input class="border p-2 rounded" type="tel" placeholder="Телефон" required>
        <input class="border p-2 rounded" type="text" placeholder="Название товара" required>
        <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Отправить</button>
      </form>
    </div>
  </main>

  <footer class="bg-gray-100 text-center p-4 mt-12 text-sm text-gray-600">
    © 2025 Магазин мебели. Все права защищены.
  </footer>

  <script>
    let products = [];
    const catalog = document.getElementById("catalog");
    const filterContainer = document.getElementById("categoryFilter");

    const renderProducts = (category = "all") => {
      catalog.innerHTML = "";
      const filtered = category === "all" ? products : products.filter(p => p.category === category);
      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow p-4 hover:shadow-md transition";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="rounded mb-4">
          <h3 class="text-xl font-bold mb-2">${product.name}</h3>
          <p class="mb-2">${product.description}</p>
          <span class="text-blue-600 font-semibold text-lg">${product.price}</span><br>
          <button onclick="document.querySelector('[placeholder=\'Название товара\']').value='${product.name}'" class="mt-2 bg-blue-600 text-white py-1 px-3 rounded hover:bg-blue-700 text-sm">Заказать</button>
        `;
        catalog.appendChild(card);
      });
    };

    const loadProducts = async () => {
      try {
        const res = await fetch("products.json");
        products = await res.json();

        const categories = [...new Set(products.map(p => p.category))];
        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.textContent = cat;
          btn.className = "bg-gray-200 hover:bg-blue-200 px-3 py-1 rounded";
          btn.dataset.category = cat;
          filterContainer.appendChild(btn);
        });

        renderProducts();
      } catch (e) {
        catalog.innerHTML = `<p class='text-red-600'>Ошибка загрузки товаров 😢</p>`;
      }
    };

    filterContainer.addEventListener("click", e => {
      if (e.target.dataset.category) {
        renderProducts(e.target.dataset.category);
      }
    });

    document.forms.orderForm.addEventListener('submit', function (e) {
      e.preventDefault();
      alert("Спасибо! Мы свяжемся с вами в ближайшее время.");
      this.reset();
    });

    document.getElementById("adminForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const newProduct = Object.fromEntries(formData.entries());

      fetch("http://localhost:5000/add-product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newProduct)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Товар успешно добавлен и сохранён в GitHub 🎉");
          loadProducts();
        } else {
          alert("Ошибка при сохранении 😢");
        }
      });

      this.reset();
    });

    loadProducts();
  </script>
</body>
</html>
